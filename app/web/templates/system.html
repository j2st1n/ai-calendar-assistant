{% extends "base.html" %}
{% block content %}
<h2 class="section-title">系统设置</h2>

{% if message %}<p class="alert success">{{ message }}</p>{% endif %}
{% if error %}<p class="alert error">{{ error }}</p>{% endif %}

<div class="grid" style="grid-template-columns:1fr 1fr;">

  <div class="card" style="margin-bottom:0;">
    <h2>管理员</h2>
    <form method="post" action="/console/system/admin" class="stack">
      <label>
        <span>用户名</span>
        <input name="username" value="{{ username }}" required>
      </label>
      <label>
        <span>当前密码</span>
        <input name="current_password" type="password" autocomplete="current-password">
      </label>
      <label>
        <span>新密码</span>
        <input name="new_password" type="password" autocomplete="new-password">
      </label>
      <label>
        <span>确认新密码</span>
        <input name="confirm_password" type="password" autocomplete="new-password">
      </label>
      <div>
        <button type="submit">保存</button>
      </div>
    </form>
  </div>

  <div class="card" style="margin-bottom:0;">
    <h2>数据管理</h2>
    <form method="post" action="/console/system/data" class="stack">
      <label>
        <span>事件记录保留数量</span>
        <input name="event_record_limit" type="number" min="1" max="100000" value="{{ event_record_limit }}" required>
      </label>
      <label>
        <span>每周起始日</span>
        <select name="week_start_day">
          <option value="0" {% if week_start_day == "0" %}selected{% endif %}>周日</option>
          <option value="1" {% if week_start_day == "1" %}selected{% endif %}>周一</option>
        </select>
      </label>
      <div>
        <button type="submit">保存</button>
      </div>
    </form>

    <hr style="border:none;border-top:1px solid rgba(255,255,255,0.06);margin:16px 0;">

    <p class="muted" style="margin-bottom:8px;font-size:12px;">备份包含默认数据目录下的数据库和密钥文件，恢复时需一起使用。</p>
    <p class="muted" style="margin-bottom:8px;font-size:12px;">若你自定义了数据目录或数据库路径，请手动备份对应的 app.db 和 secrets.json。</p>
    <a href="/console/system/backup" class="button-link">下载备份</a>
  </div>

</div>
{% endblock %}
