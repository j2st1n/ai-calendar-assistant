{% extends "base.html" %}
{% block content_login %}
<section class="card narrow">
  <h1 style="font-size:20px;font-weight:590;color:#f7f8f8;">两步验证</h1>
  <p class="muted">输入验证器中的 6 位动态验证码，或一枚恢复码。</p>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="/console/login/2fa" class="stack">
    <label>
      <span>验证码或恢复码</span>
      <input name="code" autocomplete="one-time-code" autofocus required>
    </label>
    <button type="submit" style="width:100%;">验证并登录</button>
  </form>
</section>
{% endblock %}
