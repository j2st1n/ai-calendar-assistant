{% extends "base.html" %}
{% block head %}
{% if turnstile_site_key %}
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endif %}
{% endblock %}
{% block content_login %}
<section class="card narrow">
  <h1 style="font-size: 20px; font-weight: 590; letter-spacing: -0.24px; color: #f7f8f8;">登录后台</h1>
  <p class="muted" style="margin-bottom: 20px;">首次启动生成的管理员密码可在 Docker 日志中查看。</p>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="/console/login" class="stack">
    <label>
      <span>用户名</span>
      <input name="username" autocomplete="username" value="admin" required>
    </label>
    <label>
      <span>密码</span>
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    {% if turnstile_site_key %}
    <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-action="login" data-theme="dark"></div>
    {% endif %}
    <button type="submit" style="width:100%;">登录</button>
  </form>
  <button type="button" id="passkey-login" style="width:100%;margin-top:10px;">使用通行密钥登录</button>
  <p id="passkey-error" class="muted"></p>
</section>
<script>
function b64buf(value) {
  value = value.replace(/-/g, '+').replace(/_/g, '/');
  value += '='.repeat((4 - value.length % 4) % 4);
  return Uint8Array.from(atob(value), c => c.charCodeAt(0)).buffer;
}
function bufb64(value) {
  const bytes = new Uint8Array(value || new ArrayBuffer(0));
  let binary = ''; bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
document.getElementById('passkey-login').addEventListener('click', async function () {
  const error = document.getElementById('passkey-error');
  error.textContent = '';
  try {
    const optionsResponse = await fetch('/console/login/passkey/options', {method: 'POST'});
    if (!optionsResponse.ok) throw new Error((await optionsResponse.json()).detail || '无法开始通行密钥登录');
    const options = await optionsResponse.json();
    options.challenge = b64buf(options.challenge);
    (options.allowCredentials || []).forEach(item => item.id = b64buf(item.id));
    const credential = await navigator.credentials.get({publicKey: options});
    const response = credential.response;
    const payload = {
      id: credential.id, rawId: bufb64(credential.rawId), type: credential.type,
      response: {
        authenticatorData: bufb64(response.authenticatorData),
        clientDataJSON: bufb64(response.clientDataJSON),
        signature: bufb64(response.signature),
        userHandle: response.userHandle ? bufb64(response.userHandle) : null
      }
    };
    const verifyResponse = await fetch('/console/login/passkey/verify', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
    });
    if (!verifyResponse.ok) throw new Error((await verifyResponse.json()).detail || '通行密钥登录失败');
    location.href = '/console';
  } catch (exc) {
    error.textContent = exc.message || '通行密钥登录已取消。';
  }
});
</script>
{% endblock %}
